<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity 破冰成功！</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: #333;
      padding: 20px;
    }

    .card {
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      border-radius: 24px;
      padding: 48px 36px;
      width: 100%;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(142, 197, 252, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 48px rgba(142, 197, 252, 0.45);
    }

    .icon-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
      font-size: 32px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #5a6578;
      margin-bottom: 32px;
    }

    .glow-btn {
      position: relative;
      display: inline-block;
      padding: 14px 36px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 0 20px rgba(118, 75, 162, 0.45);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      user-select: none;
    }

    .glow-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(118, 75, 162, 0.75), 0 0 50px rgba(102, 126, 234, 0.5);
    }

    .glow-btn:active {
      transform: scale(0.97);
    }

    .result-section {
      margin-top: 28px;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .click-badge {
      display: inline-block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #4a5568;
      background: rgba(255, 255, 255, 0.7);
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 10px;
      transition: opacity 0.2s ease;
    }

    .quote-text {
      font-size: 1rem;
      color: #2d3748;
      font-weight: 500;
      line-height: 1.5;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">✨</div>
    <h1>Antigravity 破冰成功！</h1>
    <p class="subtitle">點擊下方發光按鈕，開啟滿滿活力！</p>

    <button id="icebreakerBtn" class="glow-btn">點我領取能量</button>

    <div class="result-section">
      <div id="counterBadge" class="click-badge" style="display: none;">已點擊 <span id="clickCount">0</span> 次</div>
      <p id="quoteText" class="quote-text"></p>
    </div>
  </div>

  <script>
    const quotes = [
      "每一步都是前進的印記，繼續加油！",
      "你的潛力超乎想像，今天也是充滿希望的一天！",
      "程式碼如詩，思維如風，創造屬於你的精彩！",
      "累積微小的進步，終將成就偉大的改變！",
      "保持好奇心，世界會為你敞開無限可能！",
      "太棒了！又成功邁出了一大步！",
      "靈感正在發酵，繼續保持這股衝勁！",
      "相信自己，你正在打造很酷的東西！"
    ];

    let count = 0;
    let lastIndex = -1;

    const btn = document.getElementById('icebreakerBtn');
    const counterBadge = document.getElementById('counterBadge');
    const clickCountSpan = document.getElementById('clickCount');
    const quoteText = document.getElementById('quoteText');

    btn.addEventListener('click', () => {
      count++;
      clickCountSpan.textContent = count;
      counterBadge.style.display = 'inline-block';

      // 隨機選取不與上次重複的鼓勵小語
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * quotes.length);
      } while (quotes.length > 1 && randomIndex === lastIndex);
      lastIndex = randomIndex;

      // 觸發重新渲染動畫
      quoteText.textContent = quotes[randomIndex];
      quoteText.style.animation = 'none';
      void quoteText.offsetWidth; // 強制重繪
      quoteText.style.animation = 'fadeIn 0.4s ease-out';
    });
  </script>
</body>
</html>
